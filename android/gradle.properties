# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# When configured, Gradle will run in parallel mode.
# Only use this when you have a multi-core processor.
org.gradle.parallel=true

# Kotlin compiler caching
kotlin.daemon.jvm.options=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Build caching
android.buildCache=true
org.gradle.caching=true

# KSP
ksp.incremental=true
ksp.incremental.interop=true

